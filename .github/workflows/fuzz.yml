# SPDX-License-Identifier: Apache-2.0
# Nightly fuzzing of every parser (CLAUDE.md §8.8, §9) with libFuzzer under
# ASan and UBSan. Crashing inputs are uploaded as artifacts.
name: Fuzz

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per fuzz target"
        default: "120"

permissions:
  contents: read

env:
  LLVM_VERSION: 19

jobs:
  fuzz:
    name: libFuzzer (clang, Debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y ninja-build libwayland-dev libxkbcommon-dev wayland-protocols xorg-dev xvfb
      - name: Configure
        run: >
          cmake --preset linux-clang -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }}
          -DNPH_BUILD_FUZZERS=ON -DNPH_BUILD_TESTS=OFF -DNPH_BUILD_BENCHMARKS=OFF -DNPH_BUILD_SAMPLES=OFF
      - name: "Build (Debug: ASan + UBSan)"
        run: cmake --build --preset linux-clang-debug
      - name: Fuzz
        shell: bash
        run: |
          seconds="${{ github.event.inputs.seconds || '120' }}"
          mkdir -p fuzz-out
          status=0
          for exe in build/linux-clang/bin/Debug/*_fuzz; do
            name=$(basename "$exe" _fuzz)
            corpus="tests/fuzz/corpus/$name"
            mkdir -p "$corpus" "fuzz-out/$name"
            echo "== $name"
            if ! "$exe" -max_total_time="$seconds" -timeout=10 -rss_limit_mb=2048 \
                 -artifact_prefix="fuzz-out/$name/" "$corpus"; then
              status=1
            fi
          done
          exit $status
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: fuzz-out/
          if-no-files-found: ignore
