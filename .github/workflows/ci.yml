# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLVM_VERSION: 19
  # The Vulkan SDK release the vendored headers, volk, and the validation
  # layer on the development machine are pinned to (docs/adr/0014).
  VULKAN_SDK_VERSION: 1.4.321.1
  # Linux GPU tests run on lavapipe, Mesa's software Vulkan driver
  # (CLAUDE.md §6, §9); the loader is told to use only that ICD. Ubuntu's
  # mesa-vulkan-drivers names the manifest lvp_icd.json (upstream Mesa
  # installs lvp_icd.x86_64.json). Only the file that exists may be listed:
  # the loader reports a missing entry as an error through debug utils,
  # and the tests' validation gate counts it.
  VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
  # The loader and lavapipe keep process-lifetime state that LeakSanitizer
  # would otherwise report (tests/lsan.supp).
  LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp

jobs:
  format:
    name: clang-format + layering
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact version Visual Studio 2022 ships, so local and CI
      # formatting can never disagree.
      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: python3 -m pip install --user clang-format==${{ env.CLANG_FORMAT_VERSION }}
        env:
          CLANG_FORMAT_VERSION: 19.1.5
      - name: Check formatting
        run: python3 scripts/format.py --check
      # The module dependency rule and the third-party include policy
      # (CLAUDE.md §1.8, §4).
      - name: Check layering
        run: python3 scripts/check_layering.py

  build:
    name: ${{ matrix.name }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-msvc,  os: windows-2022, preset: win-msvc,    config: Debug,       cfg: debug }
          - { name: windows-msvc,  os: windows-2022, preset: win-msvc,    config: Development, cfg: development }
          - { name: windows-msvc,  os: windows-2022, preset: win-msvc,    config: Shipping,    cfg: shipping }
          # The Win32 fiber fallback (ADR-0010 §6) must keep passing the same tests.
          - { name: windows-msvc-win32-fibers, os: windows-2022, preset: win-msvc, config: Development, cfg: development, extra: -DNPH_FIBERS_WIN32=ON }
          - { name: windows-clang, os: windows-2022, preset: win-clang,   config: Debug,       cfg: debug }
          - { name: windows-clang, os: windows-2022, preset: win-clang,   config: Development, cfg: development }
          - { name: linux-gcc,     os: ubuntu-24.04, preset: linux-gcc,   config: Debug,       cfg: debug }
          - { name: linux-gcc,     os: ubuntu-24.04, preset: linux-gcc,   config: Development, cfg: development }
          - { name: linux-gcc,     os: ubuntu-24.04, preset: linux-gcc,   config: Shipping,    cfg: shipping }
          - { name: linux-clang,   os: ubuntu-24.04, preset: linux-clang, config: Debug,       cfg: debug }
          - { name: linux-clang,   os: ubuntu-24.04, preset: linux-clang, config: Development, cfg: development }
          # Clang without asserts: its -Wunused-but-set-variable counts `+=` as a
          # write, which GCC and MSVC do not flag, so a value only an assert reads
          # broke the nightly Benchmarks' Profile build unseen for a week.
          - { name: linux-clang,   os: ubuntu-24.04, preset: linux-clang, config: Shipping,    cfg: shipping }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The golden-image baselines are Git LFS objects (tests/golden/baselines,
      # docs/golden.md), and only the Linux jobs render them (lavapipe). The
      # LFS store is cached under the list of objects, so a run downloads
      # only baselines it has not seen.
      - name: List the LFS objects
        if: runner.os == 'Linux'
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects
      - name: Cache the LFS objects
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
      - name: Fetch the LFS objects
        if: runner.os == 'Linux'
        run: git lfs pull

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/dev_env.ps1 -GitHubEnv

      # Windows runners have no GPU and no Vulkan driver, so the GPU tests
      # and samples skip there; the SDK provides glslc for the shader build.
      - name: Cache the Vulkan SDK
        if: runner.os == 'Windows'
        id: vulkan-sdk
        uses: actions/cache@v6
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-windows
      - name: Install the Vulkan SDK
        if: runner.os == 'Windows' && steps.vulkan-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/install_vulkan_sdk.ps1 -Version ${{ env.VULKAN_SDK_VERSION }}
      - name: Point the build at the Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}\Bin" >> $env:GITHUB_PATH

      - name: Install Ninja, the window system packages, glslc, and lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libwayland-dev libxkbcommon-dev wayland-protocols xorg-dev xvfb \
            glslc libvulkan1 mesa-vulkan-drivers
      # Ubuntu's vulkan-validationlayers (1.3.275 on 24.04) is far behind the
      # pinned SDK layer: it crashes inside itself on lavapipe and reports
      # synchronisation hazards the pinned layer does not. The layer from the
      # pinned SDK release is installed instead (cached per version) and
      # VK_LAYER_PATH points the loader at it alone.
      - name: Cache the Vulkan validation layer
        if: runner.os == 'Linux'
        id: vulkan-layer
        uses: actions/cache@v6
        with:
          path: ~/vulkan-sdk
          key: vulkan-layer-${{ env.VULKAN_SDK_VERSION }}-linux
      - name: Install the Vulkan validation layer
        if: runner.os == 'Linux' && steps.vulkan-layer.outputs.cache-hit != 'true'
        run: ./scripts/install_vulkan_layer.sh ${{ env.VULKAN_SDK_VERSION }}
      - name: Point the loader at the validation layer
        if: runner.os == 'Linux'
        run: echo "VK_LAYER_PATH=$HOME/vulkan-sdk/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      - name: Tool versions
        shell: bash
        run: |
          cmake --version | head -1
          ninja --version
          glslc --version | head -1
          case "${{ matrix.preset }}" in
            win-msvc)    cl 2>&1 | head -1 ;;
            win-clang)   clang-cl --version | head -1 ;;
            linux-gcc)   gcc --version | head -1 ;;
            linux-clang) clang --version | head -1 ;;
          esac

      # Linux runners must have the validation layer (installed above): the
      # gpu tests fail there, rather than continue unvalidated, without it.
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} ${{ matrix.extra }}
          ${{ runner.os == 'Linux' && '-DNPH_GPU_REQUIRE_VALIDATION=ON' || '' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-${{ matrix.cfg }}

      # Linux tests run under a virtual X server so the window tests, the
      # swapchain tests, and the GPU samples can open a window (CLAUDE.md
      # §12 Phase 3, Phase 5).
      # Which optional features lavapipe offers decides which renderer
      # paths CI exercises (docs/render.md); ctest hides a passing test's
      # log, so print the device's here.
      - name: GPU features (lavapipe)
        if: runner.os == 'Linux'
        run: ./build/${{ matrix.preset }}/bin/${{ matrix.config }}/gpu_tests --filter=gpu_device.optional_features_can_be_disabled

      - name: Test (Linux, under Xvfb, on lavapipe)
        if: runner.os == 'Linux'
        run: >
          xvfb-run -a ctest --preset ${{ matrix.preset }}-${{ matrix.cfg }}
          --output-junit "${{ github.workspace }}/build/${{ matrix.preset }}/test-results/ctest-${{ matrix.cfg }}.xml"

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: >
          ctest --preset ${{ matrix.preset }}-${{ matrix.cfg }}
          --output-junit "${{ github.workspace }}/build/${{ matrix.preset }}/test-results/ctest-${{ matrix.cfg }}.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}-${{ matrix.cfg }}
          path: build/${{ matrix.preset }}/test-results/
          if-no-files-found: warn

      # The rendered golden images and their FLIP maps: what a reviewer
      # looks at, and what scripts/golden_approve.py approves from.
      - name: Upload the golden images
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: golden-${{ matrix.name }}-${{ matrix.cfg }}
          path: build/${{ matrix.preset }}/golden/
          if-no-files-found: ignore

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y clang-tidy-${{ env.LLVM_VERSION }} ninja-build libwayland-dev libxkbcommon-dev wayland-protocols xorg-dev xvfb glslc
      - name: Configure (single-config, exports compile_commands.json)
        run: cmake --preset linux-clang-tidy -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }}
      - name: Run clang-tidy
        run: >
          python3 scripts/tidy.py --build-dir build/linux-clang-tidy
          --clang-tidy clang-tidy-${{ env.LLVM_VERSION }}

  # Line coverage per module against the CLAUDE.md §9 targets (90 % core,
  # math, jobs; 80 % elsewhere), from a Debug build without sanitizers. The
  # gpu tests run on lavapipe so the gpu module is measured too.
  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y ninja-build libwayland-dev libxkbcommon-dev wayland-protocols xorg-dev xvfb \
            glslc libvulkan1 mesa-vulkan-drivers
      # Ubuntu's vulkan-validationlayers (1.3.275 on 24.04) is far behind the
      # pinned SDK layer: it crashes inside itself on lavapipe and reports
      # synchronisation hazards the pinned layer does not. The layer from the
      # pinned SDK release is installed instead (cached per version) and
      # VK_LAYER_PATH points the loader at it alone.
      - name: Cache the Vulkan validation layer
        id: vulkan-layer
        uses: actions/cache@v6
        with:
          path: ~/vulkan-sdk
          key: vulkan-layer-${{ env.VULKAN_SDK_VERSION }}-linux
      - name: Install the Vulkan validation layer
        if: steps.vulkan-layer.outputs.cache-hit != 'true'
        run: ./scripts/install_vulkan_layer.sh ${{ env.VULKAN_SDK_VERSION }}
      - name: Point the loader at the validation layer
        run: echo "VK_LAYER_PATH=$HOME/vulkan-sdk/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
      - name: Configure (Debug, instrumented, no sanitizers)
        run: >
          cmake --preset linux-clang-tidy -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }}
          -DCMAKE_BUILD_TYPE=Debug -DNPH_COVERAGE=ON -DNPH_ASAN=OFF -DNPH_UBSAN=OFF
          -DNPH_BUILD_BENCHMARKS=OFF -DNPH_GPU_REQUIRE_VALIDATION=ON
      - name: Build
        run: cmake --build build/linux-clang-tidy
      - name: Run unit tests with profiling
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/linux-clang-tidy/profiles/%p-%m.profraw
        run: xvfb-run -a ctest --test-dir build/linux-clang-tidy -L unit --output-on-failure
      - name: Report
        shell: bash
        run: |
          build=build/linux-clang-tidy
          llvm-profdata-${{ env.LLVM_VERSION }} merge -sparse "$build"/profiles/*.profraw \
            -o "$build/coverage.profdata"
          objects=""
          first=""; for exe in "$build"/bin/*_tests; do if [ -z "$first" ]; then first="$exe"; else objects="$objects -object $exe"; fi; done
          # The game module tests run the engine from its shared library.
          for lib in "$build"/bin/libnepheline_shared.so; do if [ -f "$lib" ]; then objects="$objects -object $lib"; fi; done
          mkdir -p "$build/coverage"
          status=0
          # One report per engine module: llvm-cov prints paths relative to
          # the sources it was restricted to, and the check needs the module.
          for dir in engine/*/; do
            module=$(basename "$dir")
            echo "== engine/$module"
            # shellcheck disable=SC2086
            llvm-cov-${{ env.LLVM_VERSION }} report "$first" $objects -instr-profile="$build/coverage.profdata" \
              -ignore-filename-regex='/(tests|tools|benchmarks|samples|third_party)/' \
              "$GITHUB_WORKSPACE/$dir" | tee "$build/coverage/$module.txt"
            python3 scripts/coverage_check.py --module "$module" "$build/coverage/$module.txt" || status=1
          done
          exit $status
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: build/linux-clang-tidy/coverage/
          if-no-files-found: warn

  # ThreadSanitizer on the job system, the ECS scheduler, the profiler, and
  # the engine's frame (CLAUDE.md §9 "TSan for jobs, audio, and streaming";
  # §12 Phase 4 exit "stress tests and TSan clean"): a Debug build with TSan
  # in place of ASan and UBSan runs the jobs tests, stress suite included,
  # the scene tests, whose schedules and transform system run on the job
  # system, the profile tests, whose rings are written by many threads and
  # drained by one, and the game module tests, headless engines whose
  # simulation job overlaps the main thread's frame (ADR-0023). The fibers
  # carry the __tsan_*_fiber annotations (ADR-0010 §5), so parked and
  # migrated jobs are tracked correctly.
  tsan:
    name: tsan (jobs, scene, profile, runtime)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Ninja, the window system packages, and glslc
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libwayland-dev libxkbcommon-dev wayland-protocols xorg-dev glslc
      - name: Configure (Debug, ThreadSanitizer)
        run: >
          cmake --preset linux-clang -DNPH_TSAN=ON -DNPH_ASAN=OFF -DNPH_UBSAN=OFF
          -DNPH_BUILD_BENCHMARKS=OFF -DNPH_BUILD_SAMPLES=OFF
      - name: Build the jobs, scene, profile, and game module tests
        run: >
          cmake --build --preset linux-clang-debug
          --target jobs_tests scene_tests profile_tests runtime_game_tests
      - name: Run them under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --preset linux-clang-debug -R '^(jobs|scene|profile|runtime_game)$' --output-on-failure

  # Single required status check for branch protection; stays stable while the
  # matrix above evolves.
  ci:
    name: CI
    if: always()
    needs: [format, build, tidy, coverage, tsan]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.format.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.tidy.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
          test "${{ needs.tsan.result }}" = "success"
