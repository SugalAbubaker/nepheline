# SPDX-License-Identifier: Apache-2.0
# Reference-hardware runs on the self-hosted RTX 3060 Ti runner
# (docs/adr/0002-self-hosted-gpu-runner.md; CLAUDE.md §6, §10.7): the gpu and
# render tests with validation on the real driver (the production renderer's
# mesh-shader path runs only here: lavapipe takes the indirect one), the GPU
# microbenchmarks against benchmarks/gpu_budgets.txt, and the renderer's
# scenes against benchmarks/render_budgets.txt (a regression of more than
# 5 % over the recorded reference fails the job), and nightly the
# third-party reference scenes against benchmarks/reference_budgets.txt.
# Runs nightly, on pushes to main, and on pull requests that touch the GPU
# or renderer code; the
# job is skipped when the runner is offline only in the sense that it
# queues until the machine is on.
name: GPU performance

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
    paths:
      - "engine/gpu/**"
      - "engine/render/**"
      - "shaders/**"
      - "benchmarks/gpu/**"
      - "benchmarks/gpu_budgets.txt"
      - "benchmarks/render/**"
      - "benchmarks/render_budgets.txt"
      - ".github/workflows/gpu-perf.yml"
  pull_request:
    paths:
      - "engine/gpu/**"
      - "engine/render/**"
      - "shaders/**"
      - "benchmarks/gpu/**"
      - "benchmarks/gpu_budgets.txt"
      - "benchmarks/render/**"
      - "benchmarks/render_budgets.txt"
      - ".github/workflows/gpu-perf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    name: RTX 3060 Ti reference runs
    # Fork pull requests must never execute on this machine (ADR-0002).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, gpu, rtx3060ti]
    # A nightly run that cooks a reference scene afresh (a new cooker
    # output) takes over an hour; a pull request's run, minutes.
    timeout-minutes: 150
    # Windows PowerShell 5.1, which every Windows machine has (the reference
    # machine has no pwsh), run so that the step does not depend on the
    # machine's script execution policy, which refused the step's temporary
    # script under the runner's standard user. The trailer fails the step on
    # a native command's exit code, as GitHub's own powershell shell does
    # (the runner formats the template with .NET, so braces are doubled).
    defaults:
      run:
        shell: "powershell -NoProfile -ExecutionPolicy Bypass -Command \"$ErrorActionPreference = 'Stop'; . '{0}'; if ((Test-Path -LiteralPath variable:LASTEXITCODE)) {{ exit $LASTEXITCODE }}\""
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up the MSVC environment
        run: ./scripts/dev_env.ps1 -GitHubEnv

      # The reference machine has the SDK layer: the gpu tests fail, rather
      # than run unvalidated, if it ever goes missing.
      - name: Configure
        run: cmake --preset win-msvc -DNPH_GPU_REQUIRE_VALIDATION=ON

      - name: Build (Development, Profile)
        run: |
          cmake --build --preset win-msvc-development
          cmake --build --preset win-msvc-profile

      # Validation and synchronisation validation on the real driver.
      - name: GPU and render tests (Development, validation on)
        run: ctest --preset win-msvc-development -R "^gpu$|^render\.[0-9]+$|^sample\.gpu_" --output-on-failure

      - name: GPU benchmarks (Profile)
        run: |
          New-Item -ItemType Directory -Force bench-results | Out-Null
          .\build\win-msvc\bin\Profile\gpu_bench.exe --repeats=20 --json=bench-results\gpu_bench.json --budgets=benchmarks\gpu_budgets.txt

      # Every scene, CPU and GPU per pass with its declared bytes (§10.7).
      - name: Renderer runs (Profile)
        run: .\build\win-msvc\bin\Profile\render_perf.exe --frames=240 --json=bench-results\render_perf.json --budgets=benchmarks\render_budgets.txt

      # The third-party reference scenes (docs/adr/0040-reference-scenes.md),
      # nightly and when dispatched, not on pull requests: fetched at their
      # manifests' pinned commits into a directory that persists between jobs
      # (the repository variable NPH_SCENES_DIR, else the runner's tool cache),
      # cooked there by this build's cooker (incrementally: Bistro's 23
      # minutes recur only when the cooker's output changes), then measured
      # against benchmarks/reference_budgets.txt. The job's user has no Python
      # of its own; setup-python keeps one in the tool cache.
      - name: Python for the scene script
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reference scenes, fetched and cooked
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SCENES_DIR: ${{ vars.NPH_SCENES_DIR }}
        run: |
          $scenes = $env:SCENES_DIR
          if (-not $scenes) { $scenes = Join-Path $env:RUNNER_TOOL_CACHE 'nepheline-scenes' }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "NPH_SCENES=$scenes`n", (New-Object System.Text.UTF8Encoding $false))
          python scripts/scenes.py fetch --dir $scenes
          python scripts/scenes.py cook --dir $scenes --cook build\win-msvc\bin\Profile\nph_cook.exe

      - name: Reference scenes (Profile)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: .\build\win-msvc\bin\Profile\render_perf.exe --scenes=$env:NPH_SCENES --reference-only --frames=240 --json=bench-results\reference_scenes.json --budgets=benchmarks\reference_budgets.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-benchmark-results
          path: bench-results/
